name: Bug report
description: Sprout did something wrong or crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please don't use this form; see [SECURITY.md](https://github.com/Sprout-DevLabs/sprout/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what Sprout printed. Paste the output in full.
      placeholder: |
        $ sprout dependents src/auth.ts
        ...
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A public repository and commit, or the smallest set of files that shows it.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Sprout version
      description: Output of `sprout --version`.
      placeholder: sprout 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options: [Homebrew, Scoop, install.sh, go install, Linux package, Built from source, Other]
    validations:
      required: false
